# CI/CD Workflow para Tus Aguacates
# Automatiza tests, build y deploy a Vercel

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Permitir ejecución manual desde GitHub UI

# Variables de entorno
env:
  NODE_VERSION: '20'  # Next.js 16 requiere Node.js >= 20.9.0
  APP_DIR: '.'

jobs:
  # ============================================
  # JOB 1: Verificación de código
  # ============================================
  quality:
    name: 🔍 Lint, Typecheck y Baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧭 Lint debt report
        run: npm run lint
        continue-on-error: true

      - name: 🔎 Run quality gate
        run: npm run validate

  # ============================================
  # JOB 2: Build de producción
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build production
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-with-minimum-length-32' }}

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: ${{ env.APP_DIR }}/.next
          retention-days: 1

  # ============================================
  # JOB 4: Deploy a Vercel (solo en main)
  # ============================================
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    # Solo ejecutar en pushes a main (no en PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel (Production)
        run: |
          npx vercel pull --yes --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.VERCEL_ORG_ID }}"
          npx vercel deploy --prod --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.VERCEL_ORG_ID }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Deploy status
        if: success()
        run: |
          echo "🎉 Deploy exitoso a producción!"
          echo "🌐 URL: https://tus-aguacates.vercel.app"

      - name: ❌ Deploy failed
        if: failure()
        run: |
          echo "❌ El deploy falló. Revisa los logs para más detalles."
          exit 1

  # ============================================
  # JOB 4: Smoke tests manuales
  # Se mantienen fuera del camino crítico hasta estabilizar la suite E2E.
  # ============================================
  smoke-test:
    name: 🕵️ Smoke Tests (Post-Deploy)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run smoke tests against production
        run: npx playwright test
        env:
          BASE_URL: https://tus-aguacates.vercel.app
        continue-on-error: true

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7

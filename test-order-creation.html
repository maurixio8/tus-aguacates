<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Creación de Pedidos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #22c55e; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #16a34a; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #dcfce7; color: #166534; border: 1px solid #16a34a; }
        .error { background: #fee2e2; color: #dc2626; border: 1px solid #dc2626; }
    </style>
</head>
<body>
    <h1>🧪 Test de Creación de Pedidos</h1>
    <p>Esta página prueba la API corregida para crear pedidos manualmente.</p>

    <form id="orderForm">
        <div class="form-group">
            <label for="customer_name">Nombre del Cliente:</label>
            <input type="text" id="customer_name" name="customer_name" required value="Cliente Test">
        </div>

        <div class="form-group">
            <label for="customer_phone">Teléfono:</label>
            <input type="tel" id="customer_phone" name="customer_phone" required value="3001234567">
        </div>

        <div class="form-group">
            <label for="delivery_address">Dirección de Entrega:</label>
            <input type="text" id="delivery_address" name="delivery_address" required value="Cra 45 #67-89, Bogotá">
        </div>

        <div class="form-group">
            <label for="payment_method">Método de Pago:</label>
            <select id="payment_method" name="payment_method">
                <option value="efectivo">Efectivo</option>
                <option value="transferencia">Transferencia</option>
                <option value="tarjeta">Tarjeta</option>
            </select>
        </div>

        <button type="submit">🚀 Crear Pedido de Prueba</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const orderData = {
                customer_name: formData.get('customer_name'),
                customer_phone: formData.get('customer_phone'),
                delivery_address: formData.get('delivery_address'),
                payment_method: formData.get('payment_method'),
                items: [{
                    product_id: "test-product-id",
                    quantity: 1,
                    price: 15000,
                    product_name: "Producto de Prueba"
                }],
                total_amount: 22400 // 15000 + 7400 envío
            };

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Enviando petición...</div>';

            try {
                const response = await fetch('https://tus-aguacates.vercel.app/api/admin/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer admin-token-test'
                    },
                    body: JSON.stringify(orderData)
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Pedido Creado Exitosamente!</h3>
                            <p><strong>ID:</strong> ${data.data?.id || 'N/A'}</p>
                            <p><strong>Mensaje:</strong> ${data.message || 'Pedido creado'}</p>
                            <p><strong>Respuesta completa:</strong></p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Error al crear pedido</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Error:</strong> ${data.error || 'Error desconocido'}</p>
                            <p><strong>Detalles:</strong> ${data.details || 'Sin detalles'}</p>
                            <p><strong>Respuesta completa:</strong></p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }

            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Error de Conexión</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Verifica tu conexión a internet y la URL de la API.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
